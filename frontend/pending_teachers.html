<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTwin | Pending Teacher Approvals</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        .page-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
        }

        .back-btn {
            background: rgba(139, 92, 246, 0.1);
            color: var(--lavender);
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            transform: translateX(-4px);
        }

        .admin-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        .admin-section h2 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #E5E7EB;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #F9FAFB;
        }

        th:first-child { border-top-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(139, 92, 246, 0.02); }

        td {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        .approve-btn {
            background: linear-gradient(135deg, var(--lavender), var(--teal));
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .approve-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .empty td {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class='bx bxs-graduation gradient-text' style="font-size: 28px;"></i>
            <span class="gradient-text">TechTwin HOD</span>
        </div>

        <ul class="sidebar-nav">
            <li><a href="hod.html" class="sidebar-link"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
            <li><a href="pending_teachers.html" class="sidebar-link active"><i class='bx bxs-user-check'></i> Teacher Approvals</a></li>
            <li style="margin-top: auto;"><a href="login.html" class="sidebar-link"><i class='bx bx-log-out'></i> Logout</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <div class="page-header">
            <div>
                <h2>Pending Teacher Approvals</h2>
                <p style="color: var(--text-muted);">Review and approve new teacher registrations.</p>
            </div>
            <a href="hod.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Back to Dashboard</a>
        </div>

        <div class="admin-section">
            <h2><i class='bx bx-time-five gradient-text'></i> Teachers Waiting for Approval</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTeachersTable">
                        <tr class="empty">
                            <td colspan="4"><i class='bx bx-loader bx-spin'></i> Loading teachers...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="pending_teachers.js"></script>
<script src="theme.js"></script>
</body>
</html>
