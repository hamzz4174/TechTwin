<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTwin | Teacher Upload</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        .page-header {
            margin-bottom: 40px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .upload-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
            max-width: 700px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .input-group label {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 600;
        }

        .input-group input[type="text"], .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: var(--transition);
            background: #F9FAFB;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--lavender);
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .file-upload-wrapper {
            position: relative;
            background: rgba(139, 92, 246, 0.05);
            border: 2px dashed var(--lavender);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .file-upload-wrapper:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .file-upload-wrapper input[type="file"] {
            opacity: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-icon {
            font-size: 40px;
            color: var(--lavender);
            margin-bottom: 12px;
        }

        .file-upload-text {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 500;
        }

        .file-upload-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .btn-upload {
            background: linear-gradient(135deg, var(--lavender), var(--teal));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }

        .message { margin-top: 20px; padding: 16px; border-radius: 12px; font-weight: 500; display: none; }
        .success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; display: block; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; display: block; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class='bx bxs-graduation gradient-text' style="font-size: 28px;"></i>
            <span class="gradient-text">TechTwin Teacher</span>
        </div>

        <ul class="sidebar-nav">
            <li><a href="teacher_dashboard.html" class="sidebar-link active"><i class='bx bx-upload'></i> Upload Material</a></li>
            <li><a href="voice_record.html" class="sidebar-link "><i class='bx bx-microphone'></i> Voice Setup</a></li>
            <li><a href="login.html" class="sidebar-link"><i class='bx bx-log-out'></i> Logout</a></li>

        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <div class="page-header">
            <h2>Course Material Upload</h2>
            <p style="color: var(--text-muted);">Share lectures, notes, and study materials with your students.</p>
        </div>

        <div class="upload-card">
            
            <div class="input-group">
                <label>Subject / Topic</label>
                <input type="text" id="subject" placeholder="e.g., Mathematics, Physics 101" required>
            </div>
            
            <div class="input-group">
                <label>Lecture Title</label>
                <input type="text" id="title" placeholder="Enter a descriptive title" required>
            </div>
            
            <div class="input-group">
                <label>Description (Optional)</label>
                <textarea id="description" placeholder="Briefly describe what this material covers..."></textarea>
            </div>
            
            <div class="input-group">
                <label>Attached Document</label>
                <div class="file-upload-wrapper">
                    <i class='bx bxs-cloud-upload file-upload-icon'></i>
                    <div class="file-upload-text" id="fileNameDisplay">Drag and drop your PDF here, or click to browse</div>
                    <div class="file-upload-hint">Only .pdf files are supported</div>
                    <input type="file" id="file" accept=".pdf" required onchange="document.getElementById('fileNameDisplay').innerText = this.files[0] ? this.files[0].name : 'Drag and drop your PDF here, or click to browse'">
                </div>
            </div>
            
            <button id="uploadBtn" class="btn-upload"><i class='bx bx-cloud-upload'></i> Publish Material</button>

            <div id="message" class="message"></div>
        </div>

    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    const uploaderId = user ? (user._id || user.id) : "68bda13d86150696be5c6de7"; // fallback for testing

    const uploadBtn = document.getElementById("uploadBtn");
    const messageDiv = document.getElementById("message");

    uploadBtn.addEventListener("click", async () => {
        const subject = document.getElementById("subject").value.trim();
        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();
        const fileInput = document.getElementById("file");

        if (!subject || !title || !fileInput.files.length) {
            messageDiv.innerHTML = "<i class='bx bx-error-circle'></i> Please fill in all required fields and select a PDF.";
            messageDiv.className = "message error";
            return;
        }

        const fd = new FormData();
        fd.append("subject", subject);
        fd.append("title", title);
        fd.append("description", description);
        fd.append("file", fileInput.files[0]);
        fd.append("uploadedBy", uploaderId);

        uploadBtn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Uploading...";
        uploadBtn.disabled = true;

        try {
            const res = await fetch("http://localhost:5000/lecture", {
                method: "POST",
                body: fd
            });
            const data = await res.json();

            if (res.ok) {
                messageDiv.innerHTML = "<i class='bx bx-check-circle'></i> Lecture uploaded successfully!";
                messageDiv.className = "message success";
                document.getElementById("subject").value = "";
                document.getElementById("title").value = "";
                document.getElementById("description").value = "";
                fileInput.value = "";
                document.getElementById('fileNameDisplay').innerText = "Drag and drop your PDF here, or click to browse";
            } else {
                messageDiv.innerHTML = "<i class='bx bx-error-circle'></i> Upload failed: " + (data.message || JSON.stringify(data));
                messageDiv.className = "message error";
            }
        } catch (err) {
            messageDiv.innerHTML = "<i class='bx bx-error-circle'></i> Network error: " + err.message;
            messageDiv.className = "message error";
        } finally {
            uploadBtn.innerHTML = "<i class='bx bx-cloud-upload'></i> Publish Material";
            uploadBtn.disabled = false;
        }
    });
</script>
<script src="theme.js"></script>
</body>
</html>
