<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTwin | Profile Settings</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        .page-header {
            margin-bottom: 40px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
        }

        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            height: fit-content;
        }

        .profile-avatar {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .camera-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: linear-gradient(135deg, var(--lavender), var(--teal));
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: var(--transition);
        }

        .camera-btn:hover {
            transform: scale(1.1);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-role {
            color: var(--teal);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .upload-photo {
            background: rgba(139, 92, 246, 0.1);
            color: var(--lavender);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            margin-bottom: 12px;
        }

        .upload-photo:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        .photo-info {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Settings Card */
        .settings-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .settings-section {
            margin-bottom: 40px;
        }

        .settings-section h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--lavender);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #E5E7EB;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #E5E7EB;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: var(--transition);
            background: #F9FAFB;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--lavender);
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid #E5E7EB;
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-cancel:hover {
            background: #F3F4F6;
            color: var(--text-main);
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #10B981;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            font-weight: 600;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            bottom: 30px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class='bx bxs-graduation gradient-text' style="font-size: 28px;"></i>
            <span class="gradient-text">TechTwin</span>
        </div>

        <ul class="sidebar-nav">
            <li><a href="dashboard.html" class="sidebar-link"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
            <li><a href="subjects2.html" class="sidebar-link"><i class='bx bx-book-bookmark'></i> My Courses</a></li>
            <li><a href="doubts.html" class="sidebar-link"><i class='bx bx-message-dots'></i> Doubts</a></li>
            <li><a href="profiles.html" class="sidebar-link active"><i class='bx bx-user'></i> Profile</a></li>
            <li style="margin-top: auto;"><a href="login.html" class="sidebar-link"><i class='bx bx-log-out'></i> Logout</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <div class="page-header">
            <h2>Profile Settings</h2>
            <p style="color: var(--text-muted);">Manage your account information and preferences</p>
        </div>

        <div class="profile-layout">
            
            <!-- LEFT PROFILE CARD -->
            <div class="profile-card">
                <div class="profile-avatar">
                    <img id="profilePic" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile avatar">
                    <input type="file" id="uploadPic" accept="image/*" hidden>
                    <div class="camera-btn" onclick="document.getElementById('uploadPic').click()">
                        <i class='bx bxs-camera'></i>
                    </div>
                </div>

                <h3 id="profileName" class="profile-name">Student User</h3>
                <p class="profile-role">Computer Science</p>
                
                <button class="upload-photo" onclick="document.getElementById('uploadPic').click()">
                    Change Avatar
                </button>
                <p class="photo-info">JPG or PNG, max 5MB</p>

                <!-- Gamification stats injected via loadBadges/updateStreak -->
                <div style="margin-top: 30px; text-align: left;">
                    <h4 style="font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">Achievements</h4>
                    <div id="badgeContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </div>
            </div>

            <!-- RIGHT SETTINGS -->
            <div class="settings-card">
                
                <div class="settings-section">
                    <h3><i class='bx bx-id-card'></i> Personal Information</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" placeholder="e.g. John">
                        </div>
                        <div class="input-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" placeholder="e.g. Doe">
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h3><i class='bx bx-envelope'></i> Contact & Bio</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" id="email" disabled style="background:#E5E7EB; cursor:not-allowed;">
                        </div>
                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>
                    <div class="input-group" style="padding-top: 20px;">
                        <label>Bio</label>
                        <textarea id="bio" placeholder="Write a short description about yourself..."></textarea>
                    </div>
                </div>

                <div class="settings-section">
                    <h3><i class='bx bx-lock-alt'></i> Security</h3>
                    <div class="input-group" style="width: 50%;">
                        <label>Current Password</label>
                        <input type="password" placeholder="Enter current password">
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>New Password</label>
                            <input type="password" placeholder="Minimum 8 characters">
                        </div>
                        <div class="input-group">
                            <label>Confirm Password</label>
                            <input type="password" placeholder="Confirm new password">
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-cancel" id="cancelBtn">Discard Changes</button>
                    <button class="btn-primary" id="saveBtn"><i class='bx bx-save'></i> Save Profile</button>
                </div>
            </div>

        </div>

    </div>
</div>

<div id="toast" class="toast"><i class='bx bx-check-circle'></i> Profile Updated Successfully</div>

<script>
    const API = "http://localhost:5000";
    const user = JSON.parse(localStorage.getItem("user"));

    if(user){
        document.getElementById("profileName").innerText = user.name;
        document.getElementById("email").value = user.email || "";
        const names = user.name.split(" ");
        document.getElementById("firstName").value = names[0] || "";
        document.getElementById("lastName").value = names.slice(1).join(" ") || "";
        if(document.getElementById("phone")) document.getElementById("phone").value = user.phone || "";
        if(document.getElementById("bio")) document.getElementById("bio").value = user.bio || "";
    }

    // Load Badges logic
    function loadBadges() {
        let completed = JSON.parse(localStorage.getItem("completedPDFs")) || {};
        let total = 0;
        Object.values(completed).forEach(arr => { total += arr.length; });
        
        const box = document.getElementById("badgeContainer");
        if(!box) return;
        
        box.innerHTML = "";
        
        // Custom badge styling
        const badgeStyle = `background: rgba(139, 92, 246, 0.1); color: var(--lavender); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;`;

        if(total === 0) {
            box.innerHTML = `<p style="font-size:13px; color:var(--text-muted);">Start reading PDFs to earn badges!</p>`;
        }
        if(total >= 1) {
            box.innerHTML += `<div style="${badgeStyle}"><i class='bx bxs-book'></i> First Steps</div>`;
        }
        if(total >= 5) {
            box.innerHTML += `<div style="${badgeStyle}"><i class='bx bxs-zap' style="color: #F59E0B"></i> Fast Learner</div>`;
        }
        if(total >= 20) {
            box.innerHTML += `<div style="${badgeStyle}"><i class='bx bxs-flame' style="color: #EF4444"></i> Dedicated Student</div>`;
        }
    }
    loadBadges();

    // Profile Pic Upload
    const picInput = document.getElementById("uploadPic");
    picInput.addEventListener("change", function(){
        const file = this.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e){
            document.getElementById("profilePic").src = e.target.result;
            localStorage.setItem("profilePic", e.target.result);
        };
        reader.readAsDataURL(file);
    });

    const savedPic = localStorage.getItem("profilePic");
    if(savedPic){
        document.getElementById("profilePic").src = savedPic;
    }

    // Save Profile
    document.getElementById("saveBtn").addEventListener("click", function(){
        let userObj = JSON.parse(localStorage.getItem("user")) || {};
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        if(document.getElementById("phone")) userObj.phone = document.getElementById("phone").value;
        if(document.getElementById("bio")) userObj.bio = document.getElementById("bio").value;

        const fullName = `${firstName} ${lastName}`.trim();
        if(fullName) userObj.name = fullName;

        localStorage.setItem("user", JSON.stringify(userObj));
        document.getElementById("profileName").innerText = fullName || userObj.name;
        showToast("Profile Settings Saved");
    });

    // Cancel Changes
    document.getElementById("cancelBtn").addEventListener("click", function(){
        location.reload();
    });

    function showToast(message){
        const toast = document.getElementById("toast");
        toast.innerHTML = `<i class='bx bx-check-circle'></i> ${message}`;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }
</script>
<script src="theme.js"></script>
</body>
</html>
