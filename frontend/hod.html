<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTwin | HOD Dashboard</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        .page-header {
            margin-bottom: 30px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
        }

        .admin-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 30px;
            transition: var(--transition);
        }
        
        .admin-section:hover {
            box-shadow: var(--shadow-lg);
        }

        .admin-section h2 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .form-grid input, .form-grid select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #E5E7EB;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: #F9FAFB;
            transition: var(--transition);
            outline: none;
        }

        .form-grid input:focus, .form-grid select:focus {
            border-color: var(--lavender);
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--lavender), var(--teal));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #E5E7EB;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #F9FAFB;
        }

        th:first-child { border-top-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(139, 92, 246, 0.02); }

        td {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        .status-approved { color: #10B981; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .status-pending { color: #F59E0B; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

        .message {
            margin-top: 16px;
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class='bx bxs-graduation gradient-text' style="font-size: 28px;"></i>
            <span class="gradient-text">TechTwin HOD</span>
        </div>

        <ul class="sidebar-nav">
            <li><a href="hod.html" class="sidebar-link active"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
            <li><a href="pending_teachers.html" class="sidebar-link"><i class='bx bxs-user-check'></i> Teacher Approvals</a></li>
            <li style="margin-top: auto;"><a href="login.html" class="sidebar-link"><i class='bx bx-log-out'></i> Logout</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <div class="page-header">
            <h2>Head of Department Portal</h2>
            <p style="color: var(--text-muted);">Manage your department's teachers and subject assignments.</p>
        </div>

        <div class="layout-grid">
            <!-- Add Teacher -->
            <div class="admin-section">
                <h2><i class='bx bxs-user-plus gradient-text'></i> Add New Teacher</h2>
                <form id="teacherForm" class="form-grid">
                    <input type="text" id="teacherName" placeholder="Teacher Name" required>
                    <input type="email" id="teacherEmail" placeholder="Teacher Email" required>
                    <input type="password" id="teacherPassword" placeholder="Teacher Password" required>
                    <button type="submit" class="btn-submit">Register Teacher</button>
                </form>
                <p id="teacherMessage" class="message"></p>
            </div>

            <!-- Assign Subject -->
            <div class="admin-section">
                <h2><i class='bx bx-book-add gradient-text'></i> Assign Subject</h2>
                <form id="subjectForm" class="form-grid">
                    <select id="teacherSelect">
                        <option value="" disabled selected>Select Teacher</option>
                    </select>
                    <select id="subjectInput">
                        <option value="" disabled selected>Select Subject to Assign</option>
                    </select>
                    <button type="submit" class="btn-submit">Assign Subject</button>
                </form>
                <p id="subjectMessage" class="message"></p>
            </div>
        </div>

        <!-- Teacher Table -->
        <div class="admin-section">
            <h2><i class='bx bx-list-ul gradient-text'></i> Department Teachers Overview</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Assigned Subjects</th>
                        </tr>
                    </thead>
                    <tbody id="teacherTable"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="hod.js"></script>
<script src="theme.js"></script>
</body>
</html>
