<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTwin | Admin Panel</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        .page-header {
            margin-bottom: 30px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card p {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, var(--lavender), var(--teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Forms & Tables */
        .admin-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        .admin-section h2, .admin-section h3 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .form-grid input, .form-grid select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #E5E7EB;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: #F9FAFB;
            transition: var(--transition);
            outline: none;
        }

        .form-grid input:focus, .form-grid select:focus {
            border-color: var(--lavender);
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn-submit {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--lavender), var(--teal));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #E5E7EB;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #F9FAFB;
        }

        th:first-child { border-top-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; }

        tr:last-child td { border-bottom: none; }

        tr:hover td {
            background: rgba(139, 92, 246, 0.02);
        }

        td {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }
        
        .message {
            margin-top: 16px;
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class='bx bxs-graduation gradient-text' style="font-size: 28px;"></i>
            <span class="gradient-text">TechTwin Admin</span>
        </div>

        <ul class="sidebar-nav">
            <li><a href="#" class="sidebar-link active"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
            <li><a href="login.html" class="sidebar-link"><i class='bx bxs-group'></i> HOD Management</a></li>
            <li><a href="pending_teachers.html" class="sidebar-link"><i class='bx bx-user-check'></i> Teacher Management</a></li>
            <li style="margin-top: auto;"><a href="login.html" class="sidebar-link"><i class='bx bx-log-out'></i> Logout</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <div class="page-header">
            <h2>Super Admin Panel</h2>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total HODs</h3>
                <p id="hodCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Teachers</h3>
                <p id="teacherCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="studentCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Subjects</h3>
                <p id="subjectCount">0</p>
            </div>
        </div>

        <!-- HOD SECTION -->
        <div class="admin-section">
            <h2><i class='bx bxs-user-plus gradient-text'></i> Add New HOD</h2>
            <form id="hodForm" class="form-grid">
                <input type="text" id="hodName" placeholder="HOD Name" required>
                <input type="email" id="hodEmail" placeholder="HOD Email" required>
                <input type="password" id="hodPassword" placeholder="Password" required>
                <input type="text" id="hodDepartment" placeholder="Department" required>
                <button type="submit" class="btn-submit">Register Head of Department</button>
            </form>
            <p id="hodMessage" class="message"></p>
        </div>

        <div class="admin-section">
            <h3><i class='bx bx-list-ul gradient-text'></i> Registered HODs</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody id="hodTable"></tbody>
                </table>
            </div>
        </div>

        <!-- TEACHER SECTION -->
        <div class="admin-section">
            <h2><i class='bx bxs-user-detail gradient-text'></i> Add New Teacher</h2>
            <form id="teacherForm" class="form-grid">
                <input type="text" id="teacherName" placeholder="Teacher Name" required>
                <input type="email" id="teacherEmail" placeholder="Teacher Email" required>
                <input type="password" id="teacherPassword" placeholder="Password" required>
                <select id="teacherHod" required>
                    <option value="" disabled selected>Select Assigning HOD</option>
                </select>
                <button type="submit" class="btn-submit">Register Teacher</button>
            </form>
            <p id="teacherMessage" class="message"></p>
        </div>

        <div class="admin-section">
            <h3><i class='bx bx-list-ol gradient-text'></i> Registered Teachers</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>HOD</th>
                        </tr>
                    </thead>
                    <tbody id="teacherTable"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="admin.js"></script>
<script src="theme.js"></script>
</body>
</html>
